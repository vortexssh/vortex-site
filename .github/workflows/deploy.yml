name: Deploy landing to Server

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            if [ ! -d /opt/vortex-site/.git ]; then
              src=$(git -C /opt/vortex-web remote get-url origin)
              clone_url=${src/vortex-web/vortex-site}
              git clone "$clone_url" /opt/vortex-site
            fi
            cd /opt/vortex-site
            git fetch origin master
            git reset --hard origin/master
            docker rm -f vortex-site-web-1 2>/dev/null || true
            docker compose up -d --build
